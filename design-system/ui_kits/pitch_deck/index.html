<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>AvangardAI pitch deck</title><link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body{margin:0;background:var(--lavender-ice);font-family:var(--font-sans);padding:24px;}
  h1{font-size:28px;letter-spacing:-.02em;margin:0 0 20px;font-weight:400;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .card{background:#fff;border-radius:12px;overflow:hidden;}
  .card .thumb{aspect-ratio:16/9;}
  .card .lbl{padding:12px 16px;font-size:14px;letter-spacing:-.01em;display:flex;justify-content:space-between;}
  .card .lbl a{color:var(--accent);text-decoration:none;font-family:var(--font-mono);font-size:12px;}
  iframe{width:100%;height:100%;border:0;display:block;}
</style></head>
<body>
<h1>AvangardAI — Pitch deck kit</h1>
<div class="grid">
  <div class="card"><div class="thumb"><iframe src="Title.html"></iframe></div><div class="lbl"><span>Title</span><a href="Title.html">open ↗</a></div></div>
  <div class="card"><div class="thumb"><iframe src="SectionDivider.html"></iframe></div><div class="lbl"><span>Section divider</span><a href="SectionDivider.html">open ↗</a></div></div>
  <div class="card"><div class="thumb"><iframe src="TwoColumnCase.html"></iframe></div><div class="lbl"><span>Two-column case</span><a href="TwoColumnCase.html">open ↗</a></div></div>
  <div class="card"><div class="thumb"><iframe src="FrostedTiles.html"></iframe></div><div class="lbl"><span>Frosted tiles</span><a href="FrostedTiles.html">open ↗</a></div></div>
  <div class="card"><div class="thumb"><iframe src="Contact.html"></iframe></div><div class="lbl"><span>Contact closer</span><a href="Contact.html">open ↗</a></div></div>
</div>
</body></html>
