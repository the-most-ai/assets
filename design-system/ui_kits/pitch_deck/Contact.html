<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Contact</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html,body{margin:0;background:#222;}
  .stage{position:relative;width:1920px;height:1080px;transform-origin:top left;}
  .slide{width:1920px;height:1080px;background:var(--lavender-ice);color:var(--ink);position:relative;overflow:hidden;}
  .chaos{position:absolute;right:0;top:0;width:880px;height:100%;background:url('../../assets/bg-chaos-blue-30.png') center/cover;mix-blend-mode:multiply;}
  .body{position:absolute;left:40px;top:40px;width:900px;}
  .h{font-size:82px;line-height:1.1;letter-spacing:-.02em;font-weight:400;color:var(--ink);margin:0 0 64px;}
  .row{display:flex;align-items:center;gap:32px;margin-bottom:24px;}
  .row .circle{width:80px;height:80px;border-radius:1000px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  .row .circle img{width:100%;height:100%;object-fit:cover;}
  .row .circle .mk{width:40px;height:40px;background:var(--accent);}
  .row .t{font-size:36px;letter-spacing:-.02em;color:var(--ink);line-height:1.3;}
  .footer{position:absolute;left:0;right:0;bottom:0;padding:40px;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:16px;color:var(--ink);}
  .footer .dot{width:5px;height:5px;border-radius:50%;background:var(--ink);display:inline-block;margin:0 10px;vertical-align:middle;}
  .footer .mark{width:28px;height:28px;background:var(--ink);display:inline-block;margin-right:12px;vertical-align:middle;}
</style></head>
<body>
<div class="stage"><div class="slide">
  <div class="chaos"></div>
  <div class="body">
    <h1 class="h">Свяжитесь<br>с нами</h1>
    <div class="row"><div class="circle"><img src="../../assets/avatar-vitaly.png" alt=""></div><div class="t">Виталий Александров, CEO</div></div>
    <div class="row"><div class="circle"><div class="mk" style="mask:url('../../assets/logo-mark-blue.svg') center/contain no-repeat;-webkit-mask:url('../../assets/logo-mark-blue.svg') center/contain no-repeat;"></div></div><div class="t">@alexandrovvitaly</div></div>
    <div class="row"><div class="circle"><div class="mk" style="background:var(--accent);width:36px;height:28px;border-radius:4px;"></div></div><div class="t">vitaly@the-most.ai</div></div>
  </div>
  <div class="footer">
    <div>№1 ИИ‑вендор в России<span class="dot"></span>2025</div>
    <div><span class="mark"></span><span>AvangardAI</span></div>
  </div>
</div></div>
<script>
  const s=document.querySelector('.stage');
  function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`scale(${k})`;document.body.style.height=(1080*k)+'px';document.body.style.width=(1920*k)+'px';}
  fit();addEventListener('resize',fit);
</script>
</body></html>
