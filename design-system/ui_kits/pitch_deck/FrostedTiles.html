<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tiles</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html,body{margin:0;background:#ddd;}
  .stage{position:relative;width:1920px;height:1080px;transform-origin:top left;}
  .slide{width:1920px;height:1080px;background:#EFEFEF;color:#000;position:relative;overflow:hidden;}
  .header{position:relative;padding:40px;}
  .header h1{font-family:var(--font-header);font-weight:700;font-size:48px;line-height:1;color:#000;margin:0;letter-spacing:-.01em;}
  .grid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 40px;margin-top:120px;}
  .tile{background:#fff;padding:40px;height:280px;box-sizing:border-box;border-radius:12px;display:flex;flex-direction:column;gap:20px;justify-content:space-between;}
  .tile.accent{background:#3737FF;color:#fff;}
  .tile.lavender{background:#E2E7FF;}
  .tile .t{font-size:26px;line-height:1.3;letter-spacing:-.01em;}
  .eye{font-family:var(--font-mono);font-size:14px;color:#3737FF;}
  .tile.accent .eye{color:rgba(255,255,255,.85);}
  .footer{position:absolute;left:0;right:0;bottom:0;padding:40px;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:16px;color:#000;}
  .footer .dot{width:5px;height:5px;border-radius:50%;background:#000;display:inline-block;margin:0 10px;vertical-align:middle;}
  .footer .mark{width:20px;height:20px;background:#000;display:inline-block;margin-right:12px;vertical-align:middle;}
</style></head>
<body>
<div class="stage"><div class="slide">
  <div class="header"><h1>Где используется платформа</h1></div>
  <div class="grid">
    <div class="tile"><div class="eye">КЕЙС 01</div><div class="t">Обработка жалоб и запросов клиентов</div></div>
    <div class="tile accent"><div class="eye">КЕЙС 02</div><div class="t">Тренировочные переговоры для РОП</div></div>
    <div class="tile lavender"><div class="eye">КЕЙС 03</div><div class="t">Сортировка лидов по скорингу</div></div>
    <div class="tile"><div class="eye">КЕЙС 04</div><div class="t">Контроль качества звонков</div></div>
  </div>
  <div class="footer">
    <div>№1 ИИ‑вендор в России<span class="dot"></span>2025</div>
    <div><span class="mark"></span><span>AvangardAI</span></div>
  </div>
</div></div>
<script>
  const s=document.querySelector('.stage');
  function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`scale(${k})`;document.body.style.height=(1080*k)+'px';document.body.style.width=(1920*k)+'px';}
  fit();addEventListener('resize',fit);
</script>
</body></html>
