<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Section divider</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html,body{margin:0;background:#ddd;}
  .stage{position:relative;width:1920px;height:1080px;transform-origin:top left;}
  .slide{width:1920px;height:1080px;background:#E2E7FF;color:#000;position:relative;overflow:hidden;}
  .chaos{position:absolute;right:-200px;bottom:-200px;width:1200px;height:1200px;background:url('../../assets/chaos-cube-alt.png') center/cover;opacity:.9;}
  .num{position:absolute;left:80px;top:80px;font-family:var(--font-mono);font-weight:300;font-size:80px;color:#3737FF;line-height:1;}
  .title{position:absolute;left:80px;top:380px;font-size:82px;line-height:1.1;letter-spacing:-.02em;font-weight:400;color:#000;max-width:1400px;margin:0;}
  .footer{position:absolute;left:0;right:0;bottom:0;padding:40px;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:16px;color:#000;}
  .footer .dot{width:5px;height:5px;border-radius:50%;background:#000;display:inline-block;margin:0 10px;vertical-align:middle;}
  .footer .mark{width:20px;height:20px;background:#000;display:inline-block;margin-right:12px;vertical-align:middle;}
  .footer .brand-r{font-family:var(--font-sans);font-size:16px;}
</style></head>
<body>
<div class="stage"><div class="slide">
  <div class="chaos"></div>
  <div class="num">03</div>
  <h1 class="title">Дополнительные<br>слайды</h1>
  <div class="footer">
    <div>№1 ИИ‑вендор в России<span class="dot"></span>2025</div>
    <div><span class="mark"></span><span class="brand-r">AvangardAI</span></div>
  </div>
</div></div>
<script>
  const s=document.querySelector('.stage');
  function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`scale(${k})`;document.body.style.height=(1080*k)+'px';document.body.style.width=(1920*k)+'px';}
  fit();addEventListener('resize',fit);
</script>
</body></html>
