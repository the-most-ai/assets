<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Report kit</title><link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body{margin:0;background:var(--lavender-ice);font-family:var(--font-sans);padding:24px;}
  h1{font-size:28px;letter-spacing:-.02em;margin:0 0 20px;font-weight:400;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .card{background:#fff;border-radius:12px;overflow:hidden;}
  .card .thumb{aspect-ratio:595/842;}
  .card .lbl{padding:12px 16px;font-size:14px;letter-spacing:-.01em;display:flex;justify-content:space-between;}
  .card .lbl a{color:var(--accent);text-decoration:none;font-family:var(--font-mono);font-size:12px;}
  iframe{width:100%;height:100%;border:0;display:block;}
</style></head>
<body>
<h1>AvangardAI — Q2 2025 Report kit</h1>
<div class="grid">
  <div class="card"><div class="thumb"><iframe src="Cover.html"></iframe></div><div class="lbl"><span>Cover</span><a href="Cover.html">open ↗</a></div></div>
  <div class="card"><div class="thumb"><iframe src="Intro.html"></iframe></div><div class="lbl"><span>Intro</span><a href="Intro.html">open ↗</a></div></div>
  <div class="card"><div class="thumb"><iframe src="Case.html"></iframe></div><div class="lbl"><span>Case study</span><a href="Case.html">open ↗</a></div></div>
</div>
</body></html>
